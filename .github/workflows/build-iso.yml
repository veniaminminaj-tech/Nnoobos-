name: Build NedohackOS bootable ISO

on:
  push:
    branches: [nedohackos-kolibri]
  pull_request:
    branches: [nedohackos-kolibri]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout NedohackOS overlay
        uses: actions/checkout@v4

      - name: Install ISO and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common syslinux-common xorriso mtools p7zip-full qemu-system-x86 file

      - name: Download official KolibriOS image
        run: |
          set -eu
          mkdir -p build/kolibri
          curl --fail --location --retry 3 --retry-delay 2 \
            https://builds.kolibrios.org/en_US/latest-img.7z \
            --output build/kolibri-img.7z
          7z x -y build/kolibri-img.7z -obuild/kolibri
          image="$(find build/kolibri -type f -iname '*.img' -print -quit)"
          test -n "$image"
          cp "$image" build/nedohackos.img
          test -s build/nedohackos.img
          file build/nedohackos.img

      - name: Add NedohackOS artwork to the KolibriOS disk image
        run: |
          set -eu
          mmd -i build/nedohackos.img ::/NEDOHACK
          mmd -i build/nedohackos.img ::/NEDOHACK/ICONS
          mcopy -i build/nedohackos.img nedohackos/assets/background/nedohackos-wallpaper.jpg ::/NEDOHACK/WALLPAPR.JPG
          for icon in computer folder text-file trash terminal settings browser app-grid; do
            case "$icon" in
              text-file) disk_name=TEXTFILE.SVG ;;
              app-grid) disk_name=APPGRID.SVG ;;
              *) disk_name="$(printf '%s' "$icon" | tr '[:lower:]' '[:upper:]').SVG" ;;
            esac
            mcopy -i build/nedohackos.img "nedohackos/assets/icons8/$icon.svg" "::/NEDOHACK/ICONS/$disk_name"
          done
          printf 'NedohackOS artwork bundle.\r\nWallpaper: /NEDOHACK/WALLPAPR.JPG\r\nSVG icons: /NEDOHACK/ICONS/\r\nThese are bundled assets; the stock KolibriOS desktop does not yet load them automatically.\r\n' > build/NEDOHACK.TXT
          mcopy -i build/nedohackos.img build/NEDOHACK.TXT ::/NEDOHACK/README.TXT
          mdir -i build/nedohackos.img ::/NEDOHACK
          mdir -i build/nedohackos.img ::/NEDOHACK/ICONS

      - name: Assemble bootable BIOS ISO
        run: |
          set -eu
          mkdir -p build/iso/boot/grub build/iso/nedohackos/assets/icons8
          memdisk="$(find /usr/lib -type f -name memdisk -print -quit)"
          test -n "$memdisk"
          cp "$memdisk" build/iso/boot/memdisk
          cp build/nedohackos.img build/iso/nedohackos.img
          cp nedohackos/assets/background/nedohackos-wallpaper.jpg build/iso/nedohackos/assets/
          cp nedohackos/assets/icons8/*.svg build/iso/nedohackos/assets/icons8/
          cp nedohackos/assets/icons8/README.md build/iso/nedohackos/assets/icons8/
          cat > build/iso/README.txt <<'EOF'
          NedohackOS — KolibriOS-based edition
          =====================================
          Boot menu title: NedohackOS based on KolibriOS
          The booted system image is the official KolibriOS prebuilt floppy image,
          with the NedohackOS artwork also copied to /NEDOHACK on that image.
          Artwork is bundled but is not yet enabled as the live desktop wallpaper
          or native desktop icons. The boot menu branding does not change the
          upstream OS's internal boot screen.
          Original KolibriOS project: https://github.com/KolibriOS/kolibrios
          EOF
          cat > build/iso/boot/grub/grub.cfg <<'EOF'
          set timeout=5
          set default=0

          menuentry "NedohackOS based on KolibriOS" {
              linux16 /boot/memdisk floppy
              initrd16 /nedohackos.img
          }

          menuentry "NedohackOS artwork and information" {
              echo "Artwork is stored in /NEDOHACK on the booted disk image."
              echo "Press Escape to return to the boot menu."
              sleep 5
          }
          EOF
          grub-mkrescue -o build/NedohackOS.iso build/iso
          test -s build/NedohackOS.iso
          file build/NedohackOS.iso
          xorriso -indev build/NedohackOS.iso -report_el_torito plain 2>&1 | tee build/iso-boot-report.txt
          grep -qi 'El Torito' build/iso-boot-report.txt

      - name: BIOS boot smoke test
        run: |
          set -eu
          set +e
          timeout 10s qemu-system-i386 \
            -machine pc -accel tcg -m 128M \
            -cdrom build/NedohackOS.iso -boot d \
            -display none -monitor none -serial none -no-reboot -no-shutdown
          status=$?
          set -e
          # Timeout is expected when QEMU remains running at the GRUB menu or OS.
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi

      - name: Upload bootable ISO and image
        uses: actions/upload-artifact@v4
        with:
          name: NedohackOS-ISO
          if-no-files-found: error
          path: |
            build/NedohackOS.iso
            build/nedohackos.img
            build/iso-boot-report.txt
