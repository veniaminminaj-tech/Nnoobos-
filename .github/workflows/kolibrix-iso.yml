name: Build KolibriX OS ISO

on:
  push:
    branches: [kolibrix-dev]
    tags: ["kolibrix-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout KolibriX
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm p7zip-full mtools grub-pc-bin grub-common xorriso syslinux-common qemu-system-x86 file

      - name: Download official KolibriOS base image
        run: |
          set -euxo pipefail
          mkdir -p build/upstream
          curl --fail --location --retry 3 --retry-delay 2 \
            https://builds.kolibrios.org/en_US/latest-img.7z \
            --output build/kolibrios-img.7z
          sha256sum build/kolibrios-img.7z | tee build/upstream-image.sha256
          7z x -y build/kolibrios-img.7z -obuild/upstream
          image="$(find build/upstream -type f -iname '*.img' -print -quit)"
          test -n "$image"
          cp "$image" build/kolibrix.img
          test -s build/kolibrix.img
          file build/kolibrix.img
          mdir -i build/kolibrix.img ::

      - name: Build KolibriX native test application
        run: |
          set -euxo pipefail
          fasm kolibrix/modules/kxhello/kxhello.asm build/KXHELLO.KEX
          fasm kolibrix/shell/kxdesk.asm build/KXDESK
          test -s build/KXHELLO.KEX
          test -s build/KXDESK
          mcopy -o -i build/kolibrix.img build/KXHELLO.KEX ::KXHELLO.KEX
          mcopy -o -i build/kolibrix.img build/KXDESK ::KXDESK
          mcopy -i build/kolibrix.img ::/SETTINGS/AUTORUN.DAT build/AUTORUN.DAT
          sed -i -E 's#^(/SYS/@TASKBAR|/SYS/@ICON|/SYS/@DOCKY)([[:space:]]+)#\# Replaced by KolibriX 98: \1\2#' build/AUTORUN.DAT
          printf '\n/SYS/KXDESK "" 0 # Start KolibriX 98 desktop\n' >> build/AUTORUN.DAT
          mcopy -o -i build/kolibrix.img build/AUTORUN.DAT ::/SETTINGS/AUTORUN.DAT
          mtype -i build/kolibrix.img ::/SETTINGS/AUTORUN.DAT | tee build/AUTORUN.final.DAT
          grep -F '/SYS/KXDESK' build/AUTORUN.final.DAT
          test "$(grep -Fc '/SYS/KXDESK' build/AUTORUN.final.DAT)" -eq 1
          ! grep -Eq '^/SYS/@(TASKBAR|ICON|DOCKY)([[:space:]]|$)' build/AUTORUN.final.DAT
          mdir -i build/kolibrix.img ::
          printf 'KolibriX 0.2 native desktop edition\r\nBased on the official KolibriOS x86 image.\r\nKXDESK is a native MENUET01 full-screen desktop shell launched at boot.\r\nThe shell provides a Windows 98-style teal desktop, taskbar, Start menu, shortcuts and launches built-in KolibriOS applications.\r\n' > build/KOLIBRIX.TXT
          mcopy -o -i build/kolibrix.img build/KOLIBRIX.TXT ::KOLIBRIX.TXT

      - name: Assemble BIOS bootable ISO
        run: |
          set -euxo pipefail
          mkdir -p build/iso/boot/grub
          memdisk="$(find /usr/lib -type f -name memdisk -print -quit)"
          test -n "$memdisk"
          cp "$memdisk" build/iso/boot/memdisk
          cp build/kolibrix.img build/iso/kolibrix.img
          cat > build/iso/README.txt <<'EOF'
          KolibriX 0.2 — native desktop image
          ===========================================
          This ISO boots the official KolibriOS x86 floppy image using GRUB MEMDISK.
          KolibriX adds the native KXDESK full-screen Windows 98-style desktop shell.
          KXDESK starts from SETTINGS/AUTORUN.DAT and replaces the stock taskbar,
          desktop icons and dock. Its Start menu launches built-in KolibriOS apps.

          This is an early native-shell release. Persistent desktop folder management,
          Python runtime and Windows PE compatibility are not implemented yet.

          Upstream: https://github.com/KolibriOS/kolibrios
          EOF
          cat > build/iso/boot/grub/grub.cfg <<'EOF'
          set timeout=4
          set default=0
          menuentry "KolibriX" {
              linux16 /boot/memdisk floppy
              initrd16 /kolibrix.img
          }
          EOF
          test "$(grep -c '^menuentry ' build/iso/boot/grub/grub.cfg)" -eq 1
          grep -F 'menuentry "KolibriX"' build/iso/boot/grub/grub.cfg
          grub-mkrescue -o build/KolibriX-0.2.0.iso build/iso
          test -s build/KolibriX-0.2.0.iso
          file build/KolibriX-0.2.0.iso
          size="$(stat -c %s build/KolibriX-0.2.0.iso)"
          test "$size" -le 5368709120
          xorriso -indev build/KolibriX-0.2.0.iso -report_el_torito plain 2>&1 | tee build/boot-report.txt
          grep -qi 'El Torito' build/boot-report.txt

      - name: BIOS boot smoke test in QEMU
        run: |
          set -euxo pipefail
          set +e
          timeout 12s qemu-system-i386 \
            -machine pc -accel tcg -m 128M \
            -cdrom build/KolibriX-0.2.0.iso -boot d \
            -display none -monitor none -serial none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi

      - name: Upload ISO build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KolibriX-0.2.0-ISO
          if-no-files-found: error
          path: |
            build/KolibriX-0.2.0.iso
            build/kolibrix.img
            build/KXHELLO.KEX
            build/KXDESK
            build/upstream-image.sha256
            build/boot-report.txt
            build/AUTORUN.final.DAT

      - name: Publish prerelease for version tags
        if: startsWith(github.ref, 'refs/tags/kolibrix-v')
        uses: softprops/action-gh-release@v2
        with:
          name: KolibriX 0.2 - Native desktop
          body: |
            ## KolibriX 0.2 - Native desktop

            - BIOS-bootable ISO based on the official KolibriOS x86 image.
            - Starts the native KXDESK graphical desktop automatically at boot.
            - Provides a Windows 98-style desktop, taskbar, Start menu and app shortcuts.
            - Launches the built-in KolibriOS file manager, terminal, editor, settings and games.
            - Built and smoke-tested in QEMU by GitHub Actions.

            Persistent desktop folders, Python runtime and Windows PE compatibility remain future milestones.
          files: |
            build/KolibriX-0.2.0.iso
            build/KXHELLO.KEX
            build/KXDESK
          prerelease: true
          generate_release_notes: true
