name: Build KolibriX 1.0 full LiveCD ISO

env:
  KOLIBRIX_VERSION: 1.0.0

on:
  push:
    branches: [kolibrix-dev]
    tags: ["kolibrix-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout KolibriX
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm p7zip-full mtools xorriso qemu-system-x86 file

      - name: Download and unpack the FULL official KolibriOS LiveCD
        run: |
          set -euxo pipefail
          mkdir -p build/upstream
          curl --fail --location --retry 3 --retry-delay 2 \
            https://builds.kolibrios.org/en_US/latest-iso.7z \
            --output build/kolibrios-full-livecd.7z
          sha256sum build/kolibrios-full-livecd.7z | tee build/upstream-archive.sha256
          7z x -y build/kolibrios-full-livecd.7z -obuild/upstream
          upstream_iso="$(find build/upstream -type f -iname '*.iso' -print -quit)"
          test -n "$upstream_iso"
          cp "$upstream_iso" build/kolibrios-upstream.iso
          test "$(stat -c %s build/kolibrios-upstream.iso)" -gt 50000000
          file build/kolibrios-upstream.iso
          xorriso -indev build/kolibrios-upstream.iso -report_el_torito plain 2>&1 | tee build/upstream-boot-report.txt
          grep -qi 'El Torito' build/upstream-boot-report.txt

      - name: Extract the LiveCD filesystem and build KolibriX desktop
        run: |
          set -euxo pipefail
          xorriso -osirrox on -indev build/kolibrios-upstream.iso -extract /kolibri.img build/kolibri.img
          test -s build/kolibri.img
          file build/kolibri.img
          chmod u+w build/kolibri.img  # xorriso extracts ISO files read-only
          fasm kolibrix/modules/kxhello/kxhello.asm build/KXHELLO.KEX
          fasm kolibrix/shell/kxdesk.asm build/KXDESK
          test -s build/KXHELLO.KEX
          test -s build/KXDESK
          mcopy -o -i build/kolibri.img build/KXHELLO.KEX ::KXHELLO.KEX
          mcopy -o -i build/kolibri.img build/KXDESK ::KXDESK
          mcopy -o -i build/kolibri.img kolibrix/config/CEDIT.INI ::/SETTINGS/CEDIT.INI
          mcopy -i build/kolibri.img ::/SETTINGS/AUTORUN.DAT build/AUTORUN.DAT
          sed -i -E 's#^(/SYS/@TASKBAR|/SYS/@ICON|/SYS/@DOCKY)([[:space:]]+)#\# Replaced by KolibriX: \1\2#' build/AUTORUN.DAT
          printf '\n/SYS/KXDESK "" 0 # Start KolibriX desktop\n' >> build/AUTORUN.DAT
          mcopy -o -i build/kolibri.img build/AUTORUN.DAT ::/SETTINGS/AUTORUN.DAT
          mtype -i build/kolibri.img ::/SETTINGS/AUTORUN.DAT | tee build/AUTORUN.final.DAT
          grep -F '/SYS/KXDESK' build/AUTORUN.final.DAT
          test "$(grep -Fc '/SYS/KXDESK' build/AUTORUN.final.DAT)" -eq 1
          ! grep -Eq '^/SYS/@(TASKBAR|ICON|DOCKY)([[:space:]]|$)' build/AUTORUN.final.DAT
          printf 'KolibriX 1.0.0 — full LiveCD edition\r\nBased on the complete official KolibriOS LiveCD.\r\nKolibriX 1.0 provides the native KolibriX desktop shell, application launcher, Code Studio configuration, and a directly bootable patched LiveCD image.\r\nThe kernel and hardware drivers are inherited from upstream KolibriOS.\r\n' > build/KOLIBRIX.TXT
          mcopy -o -i build/kolibri.img build/KOLIBRIX.TXT ::KOLIBRIX.TXT
          mdir -i build/kolibri.img ::
          mcopy -i build/kolibri.img ::KXDESK build/KXDESK.verify
          cmp build/KXDESK build/KXDESK.verify
          mcopy -i build/kolibri.img ::/SETTINGS/CEDIT.INI build/CEDIT.verify.INI
          cmp kolibrix/config/CEDIT.INI build/CEDIT.verify.INI
          grep -F '/SYS/KXDESK' build/AUTORUN.final.DAT

      - name: Patch the full LiveCD while preserving its original boot sector
        run: |
          set -euxo pipefail
          xorriso \
            -indev build/kolibrios-upstream.iso \
            -outdev build/kolibrios-full-custom.iso \
            -boot_image any keep \
            -map build/kolibri.img /kolibri.img \
            -map build/KOLIBRIX.TXT /KOLIBRIX.TXT \
            -commit -end
          test -s build/kolibrios-full-custom.iso
          test "$(stat -c %s build/kolibrios-full-custom.iso)" -gt 50000000
          xorriso -indev build/kolibrios-full-custom.iso -report_el_torito plain 2>&1 | tee build/full-livecd-boot-report.txt
          grep -qi 'El Torito' build/full-livecd-boot-report.txt

      - name: Publish the patched full LiveCD as the primary ISO
        run: |
          set -euxo pipefail
          cp build/kolibrios-full-custom.iso build/KolibriX-1.0.0.iso
          test -s build/KolibriX-1.0.0.iso
          test "$(stat -c %s build/KolibriX-1.0.0.iso)" -gt 50000000
          file build/KolibriX-1.0.0.iso
          xorriso -indev build/KolibriX-1.0.0.iso -report_el_torito plain 2>&1 | tee build/kolibrix-boot-report.txt
          grep -qi 'El Torito' build/kolibrix-boot-report.txt
          sha256sum build/KolibriX-1.0.0.iso | tee build/KolibriX-1.0.0.iso.sha256

      - name: BIOS boot smoke test of the primary ISO
        run: |
          set -euxo pipefail
          set +e
          timeout 25s qemu-system-i386 \
            -machine pc -accel tcg -m 512M \
            -cdrom build/KolibriX-1.0.0.iso -boot d \
            -display none -monitor none -serial none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi
          echo "QEMU remained running for the smoke-test window; visual desktop validation is still required."

      - name: Upload full LiveCD build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KolibriX-1.0.0-Full-LiveCD-ISO
          if-no-files-found: error
          path: |
            build/KolibriX-1.0.0.iso
            build/kolibrios-full-custom.iso
            build/KXHELLO.KEX
            build/KXDESK
            build/CEDIT.verify.INI
            build/KXDESK.verify
            build/upstream-archive.sha256
            build/upstream-boot-report.txt
            build/full-livecd-boot-report.txt
            build/kolibrix-boot-report.txt
            build/AUTORUN.final.DAT
            build/KolibriX-1.0.0.iso.sha256

      - name: Publish stable release for version tags
        if: startsWith(github.ref, 'refs/tags/kolibrix-v')
        uses: softprops/action-gh-release@v2
        with:
          name: KolibriX 1.0.0 - Full LiveCD
          body: |
            ## KolibriX 1.0.0 - Full LiveCD

            - Based on the complete official KolibriOS LiveCD ISO, not the 1.44 MB floppy image.
            - Retains the upstream LiveCD filesystem and its bundled applications.
            - Adds the native KolibriX KXDESK shell to the system image.
            - Uses the patched full LiveCD ISO directly, preserving its original El Torito boot path instead of nesting it inside a second MEMDISK ISO.
            - The build verifies the El Torito boot record, records the ISO SHA-256 checksum, and runs a QEMU BIOS smoke test.

            Native Python execution, Windows PE/Win32 compatibility, persistent KolibriX-owned file-management features, original hardware drivers, and a rewritten kernel remain future milestones. The QEMU headless smoke test is not visual proof of the desktop.
          files: |
            build/KolibriX-1.0.0.iso
            build/kolibrios-full-custom.iso
            build/KXHELLO.KEX
            build/KXDESK
          prerelease: false
          generate_release_notes: true
