name: Cube Antivirus build
on:
  push:
    paths: ['CubeAntivirus/**', '.github/workflows/cube-antivirus.yml']
  pull_request:
    paths: ['CubeAntivirus/**', '.github/workflows/cube-antivirus.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore CubeAntivirus/CubeAntivirus.csproj
      - run: dotnet build CubeAntivirus/CubeAntivirus.csproj -c Release --no-restore
      - run: dotnet publish CubeAntivirus/CubeAntivirus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/CubeAntivirus
      - uses: actions/upload-artifact@v4
        with:
          name: CubeAntivirus-win-x64
          path: artifacts/CubeAntivirus/

# Rebuild after source fixes.
