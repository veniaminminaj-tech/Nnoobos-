name: Cube Antivirus build

on:
  push:
    paths:
      - 'Core/**'
      - 'Models/**'
      - 'Modules/**'
      - 'CubeAntivirus.CLI/**'
      - 'CubeAntivirus.csproj'
      - 'MainWindow.xaml'
      - 'MainWindow.xaml.cs'
      - 'App.xaml'
      - 'App.xaml.cs'
      - 'app.manifest'
      - 'CubeAntivirus/**'
      - '.github/workflows/cube-antivirus.yml'
  pull_request:
    paths:
      - 'Core/**'
      - 'Models/**'
      - 'Modules/**'
      - 'CubeAntivirus.CLI/**'
      - 'CubeAntivirus.csproj'
      - 'MainWindow.xaml'
      - 'MainWindow.xaml.cs'
      - 'App.xaml'
      - 'App.xaml.cs'
      - 'CubeAntivirus/**'
      - '.github/workflows/cube-antivirus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore GUI
        run: dotnet restore CubeAntivirus.csproj
      - name: Build GUI
        run: dotnet build CubeAntivirus.csproj -c Release --no-restore
      - name: Publish GUI
        run: dotnet publish CubeAntivirus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/CubeAntivirus
      - name: Restore console
        run: dotnet restore CubeAntivirus.CLI/CubeAntivirus.CLI.csproj
      - name: Publish console edition
        run: dotnet publish CubeAntivirus.CLI/CubeAntivirus.CLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/CubeAntivirus
      - name: Package visible HoneyPot worker
        shell: pwsh
        run: Copy-Item artifacts/CubeAntivirus/CubeAntivirus.exe artifacts/CubeAntivirus/CubeAntivirus.HoneyPot.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build all-in-one Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "CubeAntivirus\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
      - name: Upload all-in-one installer
        uses: actions/upload-artifact@v4
        with:
          name: CubeAntivirus-All-in-One-Setup-x64
          path: artifacts/installer/CubeAntivirus-Setup-x64.exe
          if-no-files-found: error
      - name: Upload portable GUI
        uses: actions/upload-artifact@v4
        with:
          name: CubeAntivirus-portable-win-x64
          path: artifacts/CubeAntivirus/CubeAntivirus.exe
          if-no-files-found: error
      - name: Upload portable console
        uses: actions/upload-artifact@v4
        with:
          name: CubeAntivirus-CLI-portable-win-x64
          path: artifacts/CubeAntivirus/CubeAntivirus.CLI.exe
          if-no-files-found: error
