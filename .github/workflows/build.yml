name: Build NedohackOS x86-64 + KolibriOS ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm grub-pc-bin grub-common xorriso syslinux-common mtools p7zip-full qemu-system-x86 imagemagick

      - name: Assemble and validate binaries
        run: |
          set -eu
          mkdir -p build
          fasm main.asm build/boot.bin
          fasm boot/stage2.asm build/stage2.bin
          fasm kernel/kernel64.asm build/kernel64.bin
          test "$(wc -c < build/boot.bin)" -eq 512
          test "$(wc -c < build/stage2.bin)" -le 4096
          test "$(wc -c < build/kernel64.bin)" -gt 0
          test "$(wc -c < build/kernel64.bin)" -le 4608

      - name: Create NedohackOS floppy image
        run: |
          set -eu
          truncate -s 1474560 build/nedohackos.img
          dd if=build/boot.bin of=build/nedohackos.img conv=notrunc
          dd if=build/stage2.bin of=build/nedohackos.img bs=512 seek=1 conv=notrunc
          dd if=build/kernel64.bin of=build/nedohackos.img bs=512 seek=9 conv=notrunc

      - name: Boot-test NedohackOS in QEMU
        run: |
          set -eu
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc -accel tcg -cpu qemu64 -m 128M \
            -drive file=build/nedohackos.img,if=floppy,format=raw \
            -boot a -display none -monitor none \
            -serial file:build/qemu-serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            cat build/qemu-serial.log || true
            exit 1
          fi
          cat build/qemu-serial.log
          grep -q 'NEDOHACKOS x86-64 KERNEL' build/qemu-serial.log
          grep -q 'Long mode: ACTIVE' build/qemu-serial.log

      - name: Download official KolibriOS floppy image
        run: |
          set -eu
          mkdir -p build/kolibri
          curl --fail --location --retry 3 --retry-delay 2 \
            https://builds.kolibrios.org/en_US/latest-img.7z \
            --output build/kolibri-img.7z
          7z x -y build/kolibri-img.7z -obuild/kolibri
          kolibri_image="$(find build/kolibri -type f -iname '*.img' -print -quit)"
          test -n "$kolibri_image"
          cp "$kolibri_image" build/kolibrios.img
          test -s build/kolibrios.img

      - name: Create BIOS boot menu ISO
        run: |
          set -eu
          mkdir -p build/iso/boot/grub
          memdisk_path="$(find /usr/lib -type f -name memdisk -print -quit)"
          test -n "$memdisk_path"
          cp "$memdisk_path" build/iso/boot/memdisk
          cp build/nedohackos.img build/iso/nedohackos.img
          cp build/kolibrios.img build/iso/kolibrios.img
          # Bundle MakeTools, wallpaper, and icon assets inside the ISO.
          mkdir -p build/iso/apps
          cp -R apps/makertools build/iso/apps/makertools
          mkdir -p build/iso/assets/wallpaper build/iso/assets/icons/original build/iso/assets/icons/512
          if [ -d background ]; then
            find background -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -exec cp -t build/iso/assets/wallpaper {} + || true
          fi
          if [ -d data/common/nedohackos ]; then
            cp -R data/common/nedohackos/. build/iso/assets/icons/original/
            find data/common/nedohackos -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | while IFS= read -r -d '' icon; do
              name="$(basename "$icon")"
              convert "$icon" -thumbnail '512x512' -background none -gravity center -extent 512x512 "build/iso/assets/icons/512/${name%.*}.png"
            done
          fi
          mkdir -p build/iso/docs
          cp docs/MAKETOOLS.md build/iso/docs/MAKETOOLS.md
          cat > build/iso/ASSETS-README.txt <<'EOF'
          NedohackOS bundled assets
          - assets/wallpaper/: wallpaper images copied from the repository's background/ folder
          - assets/icons/original/: original icon source files
          - assets/icons/512/: PNG icons normalized to 512x512 pixels
          Note: bundled assets are included in this ISO; the current experimental kernel is VGA text-mode only
          and does not yet display a graphical desktop or load wallpaper/icons.
          EOF
          cat > build/iso/boot/grub/grub.cfg <<'EOF'
          set timeout=8
          set default=0

          menuentry "NedohackOS x86-64 (experimental)" {
              linux16 /boot/memdisk floppy
              initrd16 /nedohackos.img
          }

          menuentry "KolibriOS (official fallback)" {
              linux16 /boot/memdisk floppy
              initrd16 /kolibrios.img
          }
          EOF
          grub-mkrescue -o build/nedohackos-kolibri.iso build/iso
          test -s build/nedohackos-kolibri.iso
          file build/nedohackos-kolibri.iso

      - name: Boot-test the complete ISO in QEMU (BIOS)
        run: |
          set -eu
          set +e
          timeout 12s qemu-system-x86_64 \
            -machine pc -accel tcg -cpu qemu64 -m 256M \
            -cdrom build/nedohackos-kolibri.iso -boot d \
            -display none -monitor none \
            -serial file:build/qemu-iso-serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU ISO boot failed with status $qemu_status"
            cat build/qemu-iso-serial.log || true
            exit 1
          fi
          cat build/qemu-iso-serial.log
          grep -q 'NEDOHACKOS x86-64 KERNEL' build/qemu-iso-serial.log
          grep -q 'Long mode: ACTIVE' build/qemu-iso-serial.log

      - name: Upload tested ISO and images
        uses: actions/upload-artifact@v4
        with:
          name: nedohackos-kolibri-boot-iso
          path: |
            build/nedohackos-kolibri.iso
            build/nedohackos.img
            build/kolibrios.img
            build/boot.bin
            build/stage2.bin
            build/kernel64.bin
            build/qemu-serial.log
            build/qemu-iso-serial.log
