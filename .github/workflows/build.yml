name: Package NedohackOS MenuetOS overlay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate overlay inputs
        run: |
          set -eu
          test -s menuetos/BGR.JPG
          test -s menuetos/config.mnt.overlay.txt
          test -s nedohackos/assets/background/nedohackos-wallpaper.jpg
          for icon in app-grid browser computer folder settings terminal text-file trash; do
            test -s "nedohackos/assets/icons8/$icon.svg"
          done

      - name: Create bitmap icon previews
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          mkdir -p dist/nedohackos-icons-bmp
          for icon in app-grid browser computer folder settings terminal text-file trash; do
            rsvg-convert -w 64 -h 64 "nedohackos/assets/icons8/$icon.svg" | convert png:- "BMP3:dist/nedohackos-icons-bmp/$icon.bmp"
          done

      - name: Package NedohackOS overlay
        run: |
          set -eu
          mkdir -p dist
          zip -r dist/nedohackos-assets.zip \
            menuetos/README.md \
            menuetos/config.mnt.overlay.txt \
            menuetos/BGR.JPG \
            dist/nedohackos-icons-bmp \
            nedohackos/assets/background \
            nedohackos/assets/icons8 \
            apps/makertools \
            docs/MAKETOOLS.md \
            docs/PYTHON_AND_ARCHIVES.md \
            README.md

      - name: Upload NedohackOS overlay
        uses: actions/upload-artifact@v4
        with:
          name: nedohackos-assets
          path: dist/nedohackos-assets.zip
