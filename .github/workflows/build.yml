name: Build NedohackOS (KolibriOS base) ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm grub-pc-bin grub-common xorriso syslinux-common mtools p7zip-full qemu-system-x86 imagemagick

      - name: Assemble and validate binaries
        run: |
          set -eu
          mkdir -p build
          fasm main.asm build/boot.bin
          fasm boot/stage2.asm build/stage2.bin
          fasm kernel/kernel64.asm build/kernel64.bin
          test "$(wc -c < build/boot.bin)" -eq 512
          test "$(wc -c < build/stage2.bin)" -le 4096
          test "$(wc -c < build/kernel64.bin)" -gt 0
          test "$(wc -c < build/kernel64.bin)" -le 4608

      - name: Create NedohackOS floppy image
        run: |
          set -eu
          truncate -s 1474560 build/nedohackos.img
          dd if=build/boot.bin of=build/nedohackos.img conv=notrunc
          dd if=build/stage2.bin of=build/nedohackos.img bs=512 seek=1 conv=notrunc
          dd if=build/kernel64.bin of=build/nedohackos.img bs=512 seek=9 conv=notrunc

      - name: Boot-test NedohackOS in QEMU
        run: |
          set -eu
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc -accel tcg -cpu qemu64 -m 128M \
            -drive file=build/nedohackos.img,if=floppy,format=raw \
            -boot a -display none -monitor none \
            -serial file:build/qemu-serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            cat build/qemu-serial.log || true
            exit 1
          fi
          cat build/qemu-serial.log
          grep -q 'NEDOHACKOS x86-64 KERNEL' build/qemu-serial.log
          grep -q 'Long mode: ACTIVE' build/qemu-serial.log

      - name: Download official KolibriOS floppy image
        run: |
          set -eu
          mkdir -p build/kolibri
          curl --fail --location --retry 3 --retry-delay 2 \
            https://builds.kolibrios.org/en_US/latest-img.7z \
            --output build/kolibri-img.7z
          7z x -y build/kolibri-img.7z -obuild/kolibri
          kolibri_image="$(find build/kolibri -type f -iname '*.img' -print -quit)"
          test -n "$kolibri_image"
          cp "$kolibri_image" build/kolibrios.img
          test -s build/kolibrios.img

      - name: Build single-system NedohackOS ISO from official KolibriOS
        run: |
          set -eu
          mkdir -p build/iso/boot/grub build/iso/NEDOHACKOS/wallpaper build/iso/NEDOHACKOS/icons/original build/iso/NEDOHACKOS/icons/512 build/iso/docs
          memdisk_path="$(find /usr/lib -type f -name memdisk -print -quit)"
          test -n "$memdisk_path"
          cp "$memdisk_path" build/iso/boot/memdisk
          cp build/kolibrios.img build/iso/kolibrios.img

          # Package every repository wallpaper and icon with the one bootable KolibriOS-based system.
          if [ -d background ]; then
            find background -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -exec cp -t build/iso/NEDOHACKOS/wallpaper {} + || true
          fi
          if [ -d data/common/nedohackos ]; then
            cp -R data/common/nedohackos/. build/iso/NEDOHACKOS/icons/original/
            find data/common/nedohackos -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | while IFS= read -r -d '' icon; do
              name="$(basename "$icon")"
              convert "$icon" -thumbnail '512x512' -background none -gravity center -extent 512x512 "build/iso/NEDOHACKOS/icons/512/${name%.*}.png"
            done
          fi
          cp docs/MAKETOOLS.md build/iso/docs/MAKETOOLS.md
          cp -R apps/makertools build/iso/NEDOHACKOS/makertools
          cat > build/iso/NEDOHACKOS/README.txt <<'EOF'
          NedohackOS is packaged as one KolibriOS-based bootable system.
          wallpapers/ contains images from the repository background/ folder.
          icons/original/ preserves source icons.
          icons/512/ contains normalized 512x512 PNG copies.
          makertools/ contains the project's MakeTools files.
          Note: PNG icon files are bundled here; applying them to the KolibriOS desktop requires converting/installing
          them into KolibriOS's native iconstrp.gif sprite and updating its icons.dat. This workflow does not pretend
          that merely bundling PNG files changes the live desktop.
          EOF
          cat > build/iso/boot/grub/grub.cfg <<'EOF'
          set timeout=0
          set default=0
          menuentry "NedohackOS (KolibriOS base)" {
              linux16 /boot/memdisk floppy
              initrd16 /kolibrios.img
          }
          EOF
          grub-mkrescue -o build/nedohackos.iso build/iso
          test -s build/nedohackos.iso
          file build/nedohackos.iso

      - name: Validate bootable ISO and packaged files
        run: |
          set -euxo pipefail
          test -s build/nedohackos.iso
          grep -q 'NedohackOS (KolibriOS base)' build/iso/boot/grub/grub.cfg
          grep -q 'linux16 /boot/memdisk floppy' build/iso/boot/grub/grub.cfg
          grep -q 'initrd16 /kolibrios.img' build/iso/boot/grub/grub.cfg
          grep -q 'NEDOHACKOS' build/iso/NEDOHACKOS/README.txt
          grub-script-check build/iso/boot/grub/grub.cfg
          file build/nedohackos.iso | grep -q 'ISO 9660'
          # Inspect the ISO paths, then extract each required file to a known destination.
          xorriso -indev build/nedohackos.iso -find / -type f -print > build/iso-file-list.txt 2> build/xorriso-list.log
          cat build/iso-file-list.txt
          grep -Fq '/boot/grub/grub.cfg' build/iso-file-list.txt
          grep -Fq '/boot/memdisk' build/iso-file-list.txt
          grep -Fq '/kolibrios.img' build/iso-file-list.txt
          grep -Fq '/NEDOHACKOS/README.txt' build/iso-file-list.txt
          xorriso -osirrox on -indev build/nedohackos.iso -extract /boot/grub/grub.cfg build/verify-grub.cfg
          xorriso -osirrox on -indev build/nedohackos.iso -extract /boot/memdisk build/verify-memdisk
          xorriso -osirrox on -indev build/nedohackos.iso -extract /kolibrios.img build/verify-kolibrios.img
          xorriso -osirrox on -indev build/nedohackos.iso -extract /NEDOHACKOS/README.txt build/verify-README.txt
          test -s build/verify-grub.cfg
          test -s build/verify-memdisk
          test -s build/verify-kolibrios.img
          test -s build/verify-README.txt
          grep -qi 'NedohackOS (KolibriOS base)' build/verify-grub.cfg
          grep -qi 'NEDOHACKOS' build/verify-README.txt
          cmp build/kolibrios.img build/verify-kolibrios.img
          test "$(wc -c < build/nedohackos.iso)" -gt 1048576

      - name: Upload tested ISO and images
        uses: actions/upload-artifact@v4
        with:
          name: nedohackos-iso
          path: |
            build/nedohackos.iso
            build/nedohackos.img
            build/kolibrios.img
            build/boot.bin
            build/stage2.bin
            build/kernel64.bin
            build/qemu-serial.log
            build/qemu-iso-serial.log
