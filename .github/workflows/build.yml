name: Build Nnoobos desktop ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm grub-pc-bin grub-common xorriso syslinux-common mtools qemu-system-x86

      - name: Assemble and validate binaries
        run: |
          set -eu
          mkdir -p build
          fasm main.asm build/boot.bin
          fasm boot/stage2.asm build/stage2.bin
          fasm kernel/kernel64.asm build/kernel64.bin
          test "$(wc -c < build/boot.bin)" -eq 512
          test "$(wc -c < build/stage2.bin)" -le 4096
          test "$(wc -c < build/kernel64.bin)" -gt 0
          test "$(wc -c < build/kernel64.bin)" -le 4608

      - name: Create Nnoobos floppy image
        run: |
          set -eu
          truncate -s 1474560 build/nnoobos.img
          dd if=build/boot.bin of=build/nnoobos.img conv=notrunc
          dd if=build/stage2.bin of=build/nnoobos.img bs=512 seek=1 conv=notrunc
          dd if=build/kernel64.bin of=build/nnoobos.img bs=512 seek=9 conv=notrunc

      - name: Boot-test Nnoobos in QEMU
        run: |
          set -eu
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc -accel tcg -cpu qemu64 -m 128M \
            -drive file=build/nnoobos.img,if=floppy,format=raw \
            -boot a -display none -monitor none \
            -serial file:build/qemu-serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            cat build/qemu-serial.log || true
            exit 1
          fi
          cat build/qemu-serial.log
          grep -q 'NNOOBOS x86-64 KERNEL' build/qemu-serial.log
          grep -q 'Long mode: ACTIVE' build/qemu-serial.log

      - name: Create Nnoobos BIOS ISO
        run: |
          set -eu
          mkdir -p build/iso/boot/grub
          curl --fail --location --retry 3 --retry-delay 2 \
            https://i.redd.it/dxvano55l0qg1.jpg \
            --output build/iso/Shedletsky.jpg
          test -s build/iso/Shedletsky.jpg
          memdisk_path="$(find /usr/lib -type f -name memdisk -print -quit)"
          test -n "$memdisk_path"
          cp "$memdisk_path" build/iso/boot/memdisk
          cp build/nnoobos.img build/iso/nnoobos.img
          mkdir -p build/iso/apps build/iso/docs
          cp -R apps/makertools build/iso/apps/makertools
          cp docs/MAKETOOLS.md build/iso/docs/MAKETOOLS.md
          cat > build/iso/boot/grub/grub.cfg <<'EOF'
          set timeout=3
          set default=0

          menuentry "Nnoobos desktop" {
              linux16 /boot/memdisk floppy
              initrd16 /nnoobos.img
          }
          EOF
          grub-mkrescue -o build/nnoobos-desktop.iso build/iso
          test -s build/nnoobos-desktop.iso
          file build/nnoobos-desktop.iso

      - name: Boot-test the complete ISO in QEMU (BIOS)
        run: |
          set -eu
          set +e
          timeout 12s qemu-system-x86_64 \
            -machine pc -accel tcg -cpu qemu64 -m 256M \
            -cdrom build/nnoobos-desktop.iso -boot d \
            -display none -monitor none \
            -serial file:build/qemu-iso-serial.log -no-reboot -no-shutdown
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            echo "QEMU ISO boot failed with status $qemu_status"
            cat build/qemu-iso-serial.log || true
            exit 1
          fi
          grep -q 'NNOOBOS x86-64 KERNEL' build/qemu-iso-serial.log
          grep -q 'Long mode: ACTIVE' build/qemu-iso-serial.log

      - name: Upload tested Nnoobos ISO and images
        uses: actions/upload-artifact@v4
        with:
          name: nnoobos-desktop-iso
          path: |
            build/nnoobos-desktop.iso
            build/nnoobos.img
            build/boot.bin
            build/stage2.bin
            build/kernel64.bin
            build/qemu-serial.log
            build/qemu-iso-serial.log
            build/iso/Shedletsky.jpg
