name: Validate NedohackOS KolibriOS overlay

on:
  push:
    branches: [nedohackos-kolibri]
  pull_request:
    branches: [nedohackos-kolibri]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NedohackOS overlay
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Checkout pinned KolibriOS source
        run: |
          set -eu
          git init upstream/kolibrios
          git -C upstream/kolibrios remote add origin https://github.com/KolibriOS/kolibrios.git
          git -C upstream/kolibrios fetch --depth 1 origin b6ad17997692b66bc42f6775404824842971e831
          git -C upstream/kolibrios checkout --detach FETCH_HEAD
          git -C upstream/kolibrios rev-parse HEAD | tee upstream-commit.txt
          test "$(cat upstream-commit.txt)" = "b6ad17997692b66bc42f6775404824842971e831"

      - name: Apply branding overlay
        run: |
          set -eu
          python3 nedohackos/apply_branding.py upstream/kolibrios
          grep -q 'NedohackOS based on KolibriOS' upstream/kolibrios/kernel/trunk/boot/bootstr-en_US.inc
          grep -q 'path=/usbhd0/1/nedohackos.img' upstream/kolibrios/data/common/settings/app.ini
          grep -q '^# NedohackOS (based on KolibriOS)$' upstream/kolibrios/README.md
          git -C upstream/kolibrios diff --check
          git -C upstream/kolibrios diff --binary > nedohackos-source-patch.patch
          test -s nedohackos-source-patch.patch

      - name: Upload source patch (not a bootable ISO)
        uses: actions/upload-artifact@v4
        with:
          name: nedohackos-kolibrios-source-patch
          path: |
            nedohackos-source-patch.patch
            upstream-commit.txt
