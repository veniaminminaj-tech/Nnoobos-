name: Package NedohackOS visual assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NedohackOS assets
        run: |
          set -eu
          test -s background/image_760c3e80.jpg
          test -s nedohackos/assets/background/nedohackos-wallpaper.jpg
          test -s nedohackos/assets/icons8/computer.svg
          test -s nedohackos/assets/icons8/folder.svg
          test -s nedohackos/assets/icons8/text-file.svg
          test -s nedohackos/assets/icons8/trash.svg
          test -s nedohackos/assets/icons8/terminal.svg
          test -s nedohackos/assets/icons8/settings.svg
          test -s nedohackos/assets/icons8/browser.svg
          test -s nedohackos/assets/icons8/app-grid.svg

      - name: Package visual assets and notes
        run: |
          set -eu
          mkdir -p dist
          zip -r dist/nedohackos-assets.zip \
            background/image_760c3e80.jpg \
            nedohackos/assets/background \
            nedohackos/assets/icons8 \
            apps/makertools \
            docs/MAKETOOLS.md \
            docs/PYTHON_AND_ARCHIVES.md \
            README.md

      - name: Upload NedohackOS assets
        uses: actions/upload-artifact@v4
        with:
          name: nedohackos-assets
          path: dist/nedohackos-assets.zip
